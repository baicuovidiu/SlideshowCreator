name: Motor 2.0 Compile Gate

on:
  workflow_dispatch:
  push:
    branches: [ 'motor-2.0' ]

permissions:
  contents: write

jobs:
  compile-gate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Acquire pinned FFmpeg for salvage app
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version='8.1.2'
          $zip="$pwd\artifacts\ffmpeg-$version-essentials_build.zip"
          $shaFile="$zip.sha256"
          New-Item -ItemType Directory -Force -Path "$pwd\artifacts" | Out-Null
          function Get-WithRetry([string]$Uri,[string]$OutFile) {
            $last=$null
            foreach($attempt in 1..5) {
              try {
                Invoke-WebRequest $Uri -OutFile $OutFile -TimeoutSec 90
                if ((Test-Path $OutFile) -and (Get-Item $OutFile).Length -gt 0) { return }
                throw "Downloaded file is empty: $OutFile"
              } catch {
                $last=$_
                Remove-Item $OutFile -Force -ErrorAction SilentlyContinue
                if ($attempt -lt 5) { Start-Sleep -Seconds ([Math]::Min(30, 3 * [Math]::Pow(2,$attempt-1))) }
              }
            }
            throw "FAIL: download failed after 5 attempts: $Uri`n$last"
          }
          Get-WithRetry "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-$version-essentials_build.zip" $zip
          Get-WithRetry "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-$version-essentials_build.zip.sha256" $shaFile
          $expected=((Get-Content $shaFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FAIL: FFmpeg checksum mismatch expected=$expected actual=$actual" }
          Expand-Archive $zip -DestinationPath "$pwd\artifacts\ffmpeg" -Force
          $bin=Get-ChildItem "$pwd\artifacts\ffmpeg" -Directory | Select-Object -First 1 | ForEach-Object { Join-Path $_.FullName 'bin' }
          if (-not (Test-Path "$bin\ffmpeg.exe") -or -not (Test-Path "$bin\ffprobe.exe")) { throw 'FAIL: pinned FFmpeg package incomplete' }
          New-Item -ItemType Directory -Force -Path '.\src\SlideshowCreator\Tools' | Out-Null
          Copy-Item "$bin\ffmpeg.exe" '.\src\SlideshowCreator\Tools\ffmpeg.exe' -Force
          Copy-Item "$bin\ffprobe.exe" '.\src\SlideshowCreator\Tools\ffprobe.exe' -Force
          & '.\src\SlideshowCreator\Tools\ffmpeg.exe' -hide_banner -encoders 2>&1 | Tee-Object -Variable enc | Out-Null
          if (-not ($enc -match 'h264_nvenc')) { throw 'FAIL: packaged FFmpeg lacks h264_nvenc' }
          if (-not ($enc -match 'libx264')) { throw 'FAIL: packaged FFmpeg lacks libx264 fallback' }
      - name: Compile Motor 2.0
        shell: pwsh
        run: |
          dotnet restore .\src\SlideshowCreator\SlideshowCreator.csproj
          dotnet build .\src\SlideshowCreator\SlideshowCreator.csproj -c Release --no-restore
      - name: Publish runnable salvage application
        shell: pwsh
        run: |
          dotnet publish .\src\SlideshowCreator\SlideshowCreator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\artifacts\SlideshowCreator-App
          $exe='.\artifacts\SlideshowCreator-App\SlideshowCreator.exe'
          $ffmpeg='.\artifacts\SlideshowCreator-App\Tools\ffmpeg.exe'
          $ffprobe='.\artifacts\SlideshowCreator-App\Tools\ffprobe.exe'
          if (-not (Test-Path $exe)) { throw 'FAIL: SlideshowCreator.exe missing' }
          if (-not (Test-Path $ffmpeg)) { throw 'FAIL: packaged ffmpeg.exe missing' }
          if (-not (Test-Path $ffprobe)) { throw 'FAIL: packaged ffprobe.exe missing' }
          & $ffmpeg -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw 'FAIL: packaged ffmpeg.exe cannot start' }
          & $ffprobe -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw 'FAIL: packaged ffprobe.exe cannot start' }
      - name: Software validate CARUSEL transition primitives
        shell: pwsh
        run: |
          $ffmpeg='.\artifacts\SlideshowCreator-App\Tools\ffmpeg.exe'
          $ffprobe='.\artifacts\SlideshowCreator-App\Tools\ffprobe.exe'
          $out='.\artifacts\carousel-software-smoke.mp4'
          & $ffmpeg -y -f lavfi -i 'color=c=red:s=1920x1080:r=30:d=1.2' -f lavfi -i 'color=c=blue:s=1920x1080:r=30:d=1.2' -filter_complex '[0:v][1:v]xfade=transition=slideleft:duration=0.3:offset=0.8,format=yuv420p[outv]' -map '[outv]' -c:v libx264 -preset ultrafast $out
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) { throw 'FAIL: CARUSEL xfade software smoke export failed' }
          $probe=& $ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -show_entries format=duration -of default=noprint_wrappers=1 $out
          if ($LASTEXITCODE -ne 0 -or -not ($probe -match 'codec_name=h264') -or -not ($probe -match 'width=1920') -or -not ($probe -match 'height=1080')) { throw 'FAIL: CARUSEL smoke ffprobe validation failed' }

      - name: Software validate full-photo CARUSEL plane composition
        shell: pwsh
        run: |
          $ffmpeg='.\artifacts\SlideshowCreator-App\Tools\ffmpeg.exe'
          $ffprobe='.\artifacts\SlideshowCreator-App\Tools\ffprobe.exe'
          $out='.\artifacts\carousel-full-photo-smoke.mp4'
          & $ffmpeg -y -f lavfi -i 'testsrc2=s=1600x900:r=30:d=1.2' -f lavfi -i 'testsrc2=s=900x1600:r=30:d=1.2' -filter_complex '[0:v]scale=1152:1080:force_original_aspect_ratio=decrease,pad=1152:1080:(ow-iw)/2:(oh-ih)/2:black,fps=30,setpts=PTS-STARTPTS,fade=t=in:st=0:d=0.28:alpha=1[a];[1:v]scale=768:1080:force_original_aspect_ratio=decrease,pad=768:1080:(ow-iw)/2:(oh-ih)/2:black,fps=30,setpts=PTS-STARTPTS,fade=t=in:st=0.14:d=0.28:alpha=1[b];[a][b]hstack=inputs=2,format=yuv420p[outv]' -map '[outv]' -t 1.2 -c:v libx264 -preset ultrafast $out
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) { throw 'FAIL: full-photo CARUSEL plane composition failed' }
          $probe=& $ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -show_entries format=duration -of default=noprint_wrappers=1 $out
          if ($LASTEXITCODE -ne 0 -or -not ($probe -match 'codec_name=h264') -or -not ($probe -match 'width=1920') -or -not ($probe -match 'height=1080')) { throw 'FAIL: full-photo CARUSEL plane ffprobe validation failed' }

      - name: Software stress CARUSEL with 120 photos
        shell: pwsh
        run: |
          $ffmpeg='.\artifacts\SlideshowCreator-App\Tools\ffmpeg.exe'
          $ffprobe='.\artifacts\SlideshowCreator-App\Tools\ffprobe.exe'
          $root='.\artifacts\carousel120'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          1..120 | ForEach-Object {
            $p=Join-Path $root ('p{0:D3}.jpg' -f $_)
            & $ffmpeg -loglevel error -y -f lavfi -i "color=c=0x202020:s=320x180:d=0.04" -frames:v 1 $p
            if ($LASTEXITCODE -ne 0) { throw "FAIL: synthetic photo generation $_" }
          }
          $list=Join-Path $root 'list.txt'
          $lines=@()
          1..120 | ForEach-Object { $p=(Resolve-Path (Join-Path $root ('p{0:D3}.jpg' -f $_))).Path.Replace("'","''"); $lines += "file '$p'"; $lines += 'duration 0.08' }
          $lines += "file '$((Resolve-Path (Join-Path $root 'p120.jpg')).Path.Replace("'","''"))'"
          $lines | Set-Content $list -Encoding utf8
          $out=Join-Path $root 'stress120.mp4'
          & $ffmpeg -loglevel error -y -f concat -safe 0 -i $list -vf 'scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:black,fps=30,format=yuv420p' -c:v libx264 -preset ultrafast $out
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) { throw 'FAIL: 120-photo software stress export failed' }
          $probe=& $ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 $out
          if ($LASTEXITCODE -ne 0 -or -not ($probe -match 'codec_name=h264') -or -not ($probe -match 'width=1920') -or -not ($probe -match 'height=1080')) { throw 'FAIL: 120-photo stress ffprobe validation failed' }

      - name: Software validate CARUSEL with music
        shell: pwsh
        run: |
          $ffmpeg='.\artifacts\SlideshowCreator-App\Tools\ffmpeg.exe'
          $ffprobe='.\artifacts\SlideshowCreator-App\Tools\ffprobe.exe'
          $out='.\artifacts\carousel-music-smoke.mp4'
          & $ffmpeg -y -f lavfi -i 'testsrc2=s=1920x1080:r=30:d=2' -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=2' -map 0:v -map 1:a -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 256k -shortest $out
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) { throw 'FAIL: CARUSEL plus music export failed' }
          $probe=& $ffprobe -v error -show_entries stream=codec_type,codec_name,width,height -of default=noprint_wrappers=1 $out
          if ($LASTEXITCODE -ne 0 -or -not ($probe -match 'codec_type=video') -or -not ($probe -match 'codec_name=h264') -or -not ($probe -match 'codec_type=audio') -or -not ($probe -match 'codec_name=aac')) { throw 'FAIL: CARUSEL plus music stream validation failed' }

      - name: Benchmark 120-photo software export
        shell: pwsh
        run: |
          $ffmpeg='.\artifacts\SlideshowCreator-App\Tools\ffmpeg.exe'
          $root='.\artifacts\carousel120'
          $list=Join-Path $root 'list.txt'
          if (-not (Test-Path $list)) { throw 'FAIL: 120-photo stress material missing before benchmark' }
          $out=Join-Path $root 'benchmark120.mp4'
          $sw=[Diagnostics.Stopwatch]::StartNew()
          & $ffmpeg -loglevel error -y -f concat -safe 0 -i $list -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=12' -vf 'scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:black,fps=30,format=yuv420p' -map 0:v -map 1:a -c:v libx264 -preset ultrafast -c:a aac -b:a 256k -shortest $out
          $sw.Stop()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) { throw 'FAIL: 120-photo benchmark export failed' }
          "SOFTWARE_BENCHMARK_120_PHOTOS_SECONDS=$([math]::Round($sw.Elapsed.TotalSeconds,2))" | Tee-Object -FilePath '.\artifacts\benchmark120.txt'

      - name: Upload runnable salvage application
        uses: actions/upload-artifact@v4
        with:
          name: SlideshowCreator-App-win-x64
          path: artifacts/SlideshowCreator-App
          if-no-files-found: error
      - name: Acquire NVENC 13.1 headers
        shell: pwsh
        run: |
          git clone https://github.com/FFmpeg/nv-codec-headers.git .\\artifacts\\nv-codec-headers
          git -C .\\artifacts\\nv-codec-headers checkout eddcea9e27f6b772057c9b3f87de2cc1737faffc
          if (-not (Test-Path '.\\artifacts\\nv-codec-headers\\include\\ffnvcodec\\nvEncodeAPI.h')) { throw 'nvEncodeAPI.h missing' }

      - name: Compile native D3D12 plus REAL NVENC branch
        shell: pwsh
        run: |
          cmake -S .\\src\\Motor2.Native -B .\\artifacts\\motor2-native -A x64 -DNVENC_SDK_INCLUDE="$pwd\\artifacts\\nv-codec-headers\\include\\ffnvcodec"
          cmake --build .\\artifacts\\motor2-native --config Release
          if (-not (Test-Path '.\\artifacts\\motor2-native\\Release\\Motor2Native.dll')) { throw 'Motor2Native.dll missing' }

      - name: Compile hardware gate
        shell: pwsh
        run: |
          dotnet restore .\src\Motor2.HardwareGate\Motor2.HardwareGate.csproj
          dotnet build .\src\Motor2.HardwareGate\Motor2.HardwareGate.csproj -c Release --no-restore

      - name: Publish and VERIFY complete self-contained hardware gate
        shell: pwsh
        run: |
          dotnet publish .\src\Motor2.HardwareGate\Motor2.HardwareGate.csproj -c Release -r win-x64 --self-contained true -p:UseAppHost=true -o .\artifacts\Motor2-HardwareGate
          Copy-Item '.\artifacts\motor2-native\Release\Motor2Native.dll' '.\artifacts\Motor2-HardwareGate\Motor2Native.dll' -Force
          $exe='.\artifacts\Motor2-HardwareGate\Motor2.HardwareGate.exe'
          $native='.\artifacts\Motor2-HardwareGate\Motor2Native.dll'
          if (-not (Test-Path $exe)) { throw 'FAIL: Motor2.HardwareGate.exe missing from deliverable' }
          if (-not (Test-Path $native)) { throw 'FAIL: Motor2Native.dll missing from deliverable' }
          Write-Host 'DELIVERABLE CONTENTS:'
          Get-ChildItem '.\artifacts\Motor2-HardwareGate' | Select-Object Name,Length
          Write-Host 'EXE SHA256:'
          Get-FileHash $exe -Algorithm SHA256
          Write-Host 'NATIVE SHA256:'
          Get-FileHash $native -Algorithm SHA256

      - name: Build ONE-EXE Hardware Gate launcher
        shell: pwsh
        run: |
          $stage = Join-Path $pwd 'artifacts\Motor2-HardwareGate'
          $payload = Join-Path $pwd 'artifacts\Motor2-HardwareGate-payload.zip'
          Compress-Archive -Path "$stage\*" -DestinationPath $payload -Force
          $proj = Join-Path $pwd 'artifacts\OneExeLauncher'
          New-Item -ItemType Directory -Force -Path $proj | Out-Null
          Copy-Item $payload (Join-Path $proj 'payload.zip') -Force
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework>
              <RuntimeIdentifier>win-x64</RuntimeIdentifier><SelfContained>true</SelfContained>
              <PublishSingleFile>true</PublishSingleFile><EnableCompressionInSingleFile>true</EnableCompressionInSingleFile>
              <AssemblyName>Motor2_HardwareGate_RTX4060</AssemblyName>
            </PropertyGroup>
            <ItemGroup><EmbeddedResource Include="payload.zip" LogicalName="payload.zip" /></ItemGroup>
          </Project>
          '@ | Set-Content (Join-Path $proj 'OneExeLauncher.csproj')
          @'
          using System;
          using System.Diagnostics;
          using System.IO;
          using System.IO.Compression;
          using System.Reflection;
          class Program {
            [STAThread] static int Main(string[] args) {
              var root=Path.Combine(Path.GetTempPath(),"Motor2HardwareGate_"+Guid.NewGuid().ToString("N"));
              Directory.CreateDirectory(root);
              try {
                using var s=Assembly.GetExecutingAssembly().GetManifestResourceStream("payload.zip") ?? throw new Exception("Embedded payload missing.");
                using var z=new ZipArchive(s,ZipArchiveMode.Read);
                z.ExtractToDirectory(root);
                var exe=Path.Combine(root,"Motor2.HardwareGate.exe");
                if(!File.Exists(exe)) throw new FileNotFoundException("Embedded Hardware Gate missing.",exe);
                var native=Path.Combine(root,"Motor2Native.dll");
                if(!File.Exists(native)) throw new FileNotFoundException("Embedded Motor2Native.dll missing.",native);
                if(args.Length>0 && args[0]=="--verify-payload") { Console.WriteLine("PASS: embedded payload extracted; child EXE and native DLL found."); return 0; }
                var p=Process.Start(new ProcessStartInfo(exe){UseShellExecute=false,WorkingDirectory=root}) ?? throw new Exception("Cannot start embedded gate.");
                p.WaitForExit();
                return p.ExitCode;
              } catch(Exception ex) {
                Console.Error.WriteLine("FAIL launcher: "+ex);
                Console.WriteLine("Apasa ENTER pentru inchidere...");
                Console.ReadLine();
                return 2;
              } finally {
                try { if(Directory.Exists(root)) Directory.Delete(root,true); } catch { }
              }
            }
          }
          '@ | Set-Content (Join-Path $proj 'Program.cs')
          dotnet publish (Join-Path $proj 'OneExeLauncher.csproj') -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o (Join-Path $pwd 'artifacts\Motor2-HardwareGate-ONE-EXE')
          $launcher=Join-Path $pwd 'artifacts\Motor2-HardwareGate-ONE-EXE\Motor2_HardwareGate_RTX4060.exe'
          if (-not (Test-Path $launcher)) { throw 'FAIL: ONE-EXE launcher missing' }
          & $launcher --verify-payload
          if ($LASTEXITCODE -ne 0) { throw 'FAIL: ONE-EXE runtime payload verification failed' }
          Get-FileHash $launcher -Algorithm SHA256
          if ((Get-Item $launcher).Length -lt 1000000) { throw 'FAIL: ONE-EXE launcher unexpectedly small' }

      - name: Publish DIRECT EXE as prerelease asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $launcher=Join-Path $pwd 'artifacts\Motor2-HardwareGate-ONE-EXE\Motor2_HardwareGate_RTX4060.exe'
          $tag="motor2-hardware-gate-$env:GITHUB_RUN_NUMBER"
          gh release view $tag --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $launcher --repo ${{ github.repository }} --target ${{ github.sha }} --title 'Motor 2.0 Hardware Gate RTX 4060' --notes 'Hardware Gate 900-frame validation build. Not the slideshow application.' --prerelease
          } else {
            gh release upload $tag $launcher --repo ${{ github.repository }} --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw 'FAIL: direct EXE release publication failed' }

      - name: Upload ONE-EXE Hardware Gate
        uses: actions/upload-artifact@v4
        with:
          name: Motor2-HardwareGate-ONE-EXE
          path: artifacts/Motor2-HardwareGate-ONE-EXE/Motor2_HardwareGate_RTX4060.exe
          if-no-files-found: error

      - name: Upload hardware gate managed package
        uses: actions/upload-artifact@v4
        with:
          name: Motor2-HardwareGate-win-x64-REAL-NVENC
          path: artifacts/Motor2-HardwareGate
          if-no-files-found: error

      - name: Architecture guard
        shell: pwsh
        run: |
          $m2 = Get-ChildItem '.\src\SlideshowCreator\Motor2' -Recurse -Filter *.cs
          if (-not $m2) { throw 'Motor2 sources missing.' }
          $bad = $m2 | Select-String -Pattern @('xfade','visual_raw','visual_polished') -SimpleMatch
          if ($bad) { throw 'Legacy render pattern leaked into Motor2.' }

# compile-gate-touch: 2026-09-20
