name: Transition Lab - Foundation Windows

on:
  push:
    branches:
      - transition-lab-0.1.0
    paths:
      - '.github/workflows/transition-lab-foundation-windows.yml'
      - 'patches/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      SHOTCUT_COMMIT: ce58962c93a283fdabc9a7617ee2a3e802f9759b
      SHOTCUT_VERSION_NUMERIC: 0.1.0
    steps:
      - uses: actions/checkout@v6

      - name: Checkout pinned Shotcut and apply Transition Lab patches
        shell: pwsh
        run: |
          git clone https://github.com/mltframework/shotcut.git shotcut-fork
          Set-Location shotcut-fork
          git checkout $env:SHOTCUT_COMMIT
          git submodule update --init --recursive
          Get-ChildItem ..\patches\*.patch | Sort-Object Name | ForEach-Object {
            git apply --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Patch validation failed: $($_.Name)" }
            git apply $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Patch application failed: $($_.Name)" }
          }
          git diff --check

      - name: Setup MSYS2 MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            autotools base-devel bzip2 coreutils git gzip tar xz zip
            perl-List-MoreUtils perl-XML-Parser
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake
            mingw-w64-x86_64-meson mingw-w64-x86_64-nasm
            mingw-w64-x86_64-ninja mingw-w64-x86_64-yasm
            mingw-w64-x86_64-cairo mingw-w64-x86_64-eigen3
            mingw-w64-x86_64-dlfcn mingw-w64-x86_64-fftw
            mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-gettext-tools
            mingw-w64-x86_64-harfbuzz mingw-w64-x86_64-lame
            mingw-w64-x86_64-libarchive mingw-w64-x86_64-libepoxy
            mingw-w64-x86_64-libexif mingw-w64-x86_64-libimagequant
            mingw-w64-x86_64-libsamplerate mingw-w64-x86_64-libtheora
            mingw-w64-x86_64-libvorbis mingw-w64-x86_64-libvpx
            mingw-w64-x86_64-libwebp mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-lilv mingw-w64-x86_64-onevpl
            mingw-w64-x86_64-openblas mingw-w64-x86_64-openssl
            mingw-w64-x86_64-opus mingw-w64-x86_64-potrace
            mingw-w64-x86_64-python-pip mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-charts mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-imageformats mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-multimedia-wmf mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-tools mingw-w64-x86_64-qt6-translations
            mingw-w64-x86_64-qt6-websockets mingw-w64-x86_64-rubberband
            mingw-w64-x86_64-sox mingw-w64-x86_64-svt-av1
            mingw-w64-x86_64-vid.stab mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader mingw-w64-x86_64-x264
            mingw-w64-x86_64-x265 mingw-w64-x86_64-zimg

      - name: Install Shotcut prebuilt dependencies
        shell: msys2 {0}
        run: |
          pacman --noconfirm -Rdd mingw-w64-x86_64-aom
          cd "$HOME"
          curl -fL --retry 3 --no-progress-meter -o mlt-prebuilt-mingw64-v7.txz https://s3.amazonaws.com/misc.meltymedia/shotcut-build/mlt-prebuilt-mingw64-v7.txz
          tar -xJf mlt-prebuilt-mingw64-v7.txz
          rm mlt-prebuilt-mingw64-v7.txz

      - name: Test articulated panels geometry
        shell: msys2 {0}
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            shotcut-fork/src/transitionlab/frei0r/panels.c \
            shotcut-fork/src/transitionlab/frei0r/panels_test.c \
            -lm -o panels-test.exe
          ./panels-test.exe

      - name: Fetch pinned build sources
        shell: msys2 {0}
        run: |
          cd shotcut-fork
          printf 'INSTALL_DIR="%s/build"\n' "$(pwd)" > build-shotcut.conf
          printf 'SOURCE_DIR="%s/build/src"\n' "$(pwd)" >> build-shotcut.conf
          printf 'SHOTCUT_VERSION="%s"\n' "$SHOTCUT_VERSION_NUMERIC" >> build-shotcut.conf
          printf 'SHOTCUT_HEAD=0\n' >> build-shotcut.conf
          printf 'SHOTCUT_REVISION=%s\n' "$SHOTCUT_COMMIT" >> build-shotcut.conf
          printf 'ACTION_GET=1\n' >> build-shotcut.conf
          printf 'ACTION_CONFIGURE=0\n' >> build-shotcut.conf
          printf 'ACTION_COMPILE_INSTALL=0\n' >> build-shotcut.conf
          bash scripts/build-shotcut-msys2.sh

      - name: Patch the exact Shotcut source that will be compiled
        shell: msys2 {0}
        run: |
          cd shotcut-fork/build/src/shotcut
          for patch in ../../../../patches/*.patch; do
            normalized="$(mktemp)"
            sed 's/\r$//' "$patch" > "$normalized"
            git apply --check "$normalized"
            git apply "$normalized"
            rm "$normalized"
          done
          test -f src/docks/transitionlabdock.cpp
          test -f src/transitionlab/frei0r/panels.c
          grep -q 'add_library(transitionlab_panels' src/CMakeLists.txt
          grep -q 'Transition Lab' src/docks/transitionlabdock.cpp
          grep -q 'slideshow->set(kExportFromProperty, 1)' src/docks/transitionlabdock.cpp
          grep -q 'slideshow->set(kShotcutVirtualClip, 1)' src/docks/transitionlabdock.cpp
          grep -q 'result->set(kExportFromProperty, 1)' src/docks/transitionlabdock.cpp
          grep -q 'result->set(kShotcutVirtualClip, 1)' src/docks/transitionlabdock.cpp
          grep -q 'Export MP4' src/docks/transitionlabdock.cpp
          git diff --check

      - name: Build the verified Transition Lab source
        shell: msys2 {0}
        run: |
          cd shotcut-fork
          printf 'ACTION_GET=0\n' >> build-shotcut.conf
          printf 'ACTION_CONFIGURE=1\n' >> build-shotcut.conf
          printf 'ACTION_COMPILE_INSTALL=1\n' >> build-shotcut.conf
          bash scripts/build-shotcut-msys2.sh

      - name: Verify and package foundation
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path shotcut-fork\build -Recurse -Filter shotcut.exe | Select-Object -First 1
          if (-not $exe) { throw "Transition Lab executable was not produced" }
          $plugin = Get-ChildItem -Path shotcut-fork\build -Recurse -Filter transitionlab_panels.dll | Select-Object -First 1
          if (-not $plugin) { throw "Articulated panels plugin was not produced" }
          $melt = Get-ChildItem -Path $exe.Directory.FullName -Filter melt.exe | Select-Object -First 1
          if (-not $melt) { throw "MLT runtime executable was not packaged" }
          $ffprobePath = "C:\msys64\mingw64\bin\ffprobe.exe"
          if (-not (Test-Path $ffprobePath)) {
            $ffprobe = Get-ChildItem -Path $exe.Directory.FullName -Recurse -Filter ffprobe.exe | Select-Object -First 1
            if (-not $ffprobe) { throw "ffprobe is unavailable for MP4 validation" }
            $ffprobePath = $ffprobe.FullName
          }
          $queryReport = Join-Path (Get-Location).Path "transition-lab-mlt-transitions.txt"
          Push-Location $exe.Directory.FullName
          try {
            $transitions = & $melt.FullName -query transitions 2>&1
            if ($LASTEXITCODE -ne 0) { throw "MLT transition query failed with exit code $LASTEXITCODE" }
            $transitions | Out-File $queryReport
            if (($transitions -join "`n") -notmatch 'frei0r\.transitionlab_panels') {
              throw "MLT did not discover frei0r.transitionlab_panels"
            }
          } finally {
            Pop-Location
          }
          $renderXml = Join-Path (Get-Location).Path "transition-lab-panels-render.mlt"
          $renderOutput = Join-Path (Get-Location).Path "transition-lab-panels-render.mp4"
          @'
          <mlt LC_NUMERIC="C" version="7.0.0" root=".">
            <profile description="Transition Lab smoke test" width="1920" height="1080" progressive="1" sample_aspect_num="1" sample_aspect_den="1" display_aspect_num="16" display_aspect_den="9" frame_rate_num="25" frame_rate_den="1" colorspace="709"/>
            <producer id="red" in="0" out="49">
              <property name="mlt_service">color</property>
              <property name="resource">#d02020</property>
            </producer>
            <producer id="blue" in="0" out="49">
              <property name="mlt_service">color</property>
              <property name="resource">#2050d0</property>
            </producer>
            <playlist id="track0"><entry producer="red" in="0" out="49"/></playlist>
            <playlist id="track1"><entry producer="blue" in="0" out="49"/></playlist>
            <tractor id="tractor0" in="0" out="49">
              <multitrack><track producer="track0"/><track producer="track1"/></multitrack>
              <transition id="panels" in="0" out="49">
                <property name="a_track">0</property>
                <property name="b_track">1</property>
                <property name="mlt_service">frei0r.transitionlab_panels</property>
                <property name="0">0=0;49=1</property>
                <property name="1">0</property>
                <property name="2">6</property>
              </transition>
            </tractor>
          </mlt>
          '@ | Set-Content -Path $renderXml -Encoding utf8
          Push-Location $exe.Directory.FullName
          try {
            & $melt.FullName $renderXml -consumer "avformat:$renderOutput" vcodec=libx264 an=1 pix_fmt=yuv420p crf=28
            if ($LASTEXITCODE -ne 0) { throw "MLT articulated panels render failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path $renderOutput)) { throw "MLT articulated panels render produced no MP4" }
          if ((Get-Item $renderOutput).Length -lt 1024) { throw "MLT articulated panels render output is unexpectedly small" }
          $probe = & $ffprobePath -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 $renderOutput 2>&1
          if ($LASTEXITCODE -ne 0) { throw "ffprobe rejected the rendered MP4 with exit code $LASTEXITCODE" }
          $probe | Out-File transition-lab-export-probe.txt
          $probeText = $probe -join "`n"
          if ($probeText -notmatch '(?m)^codec_name=h264$') { throw "Rendered MP4 is not H.264: $probeText" }
          if ($probeText -notmatch '(?m)^width=1920$') { throw "Rendered MP4 is not 1920 pixels wide: $probeText" }
          if ($probeText -notmatch '(?m)^height=1080$') { throw "Rendered MP4 is not 1080 pixels high: $probeText" }
          if ($probeText -notmatch '(?m)^r_frame_rate=25/1$') { throw "Rendered MP4 is not 25 fps: $probeText" }
          Get-FileHash $renderOutput -Algorithm SHA256 | Format-List | Out-File transition-lab-panels-render-smoke.txt
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List | Out-File transition-lab-foundation-smoke.txt
          Get-FileHash $plugin.FullName -Algorithm SHA256 | Format-List | Out-File transition-lab-panels-smoke.txt
          Compress-Archive -Path shotcut-fork\build\Shotcut -DestinationPath transition-lab-foundation-windows-x64.zip -Force
          $appSource = (Resolve-Path "shotcut-fork\build\Shotcut").Path
          $installerScript = Join-Path (Get-Location).Path "transition-lab-pilot.iss"
          @"
          [Setup]
          AppId={{F254E53E-8BA3-4C85-92D9-3308D44C51E4}
          AppName=Transition Lab
          AppVersion=0.1.0
          AppPublisher=Transition Lab contributors
          DefaultDirName={autopf}\Transition Lab
          DefaultGroupName=Transition Lab
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=$((Get-Location).Path)
          OutputBaseFilename=Transition-Lab-0.1.0-Windows-x64-Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayIcon={app}\shotcut.exe
          [Files]
          Source: "$appSource\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\Transition Lab"; Filename: "{app}\shotcut.exe"
          Name: "{autodesktop}\Transition Lab"; Filename: "{app}\shotcut.exe"; Tasks: desktopicon
          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"
          [Run]
          Filename: "{app}\shotcut.exe"; Description: "Launch Transition Lab"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Path $installerScript -Encoding utf8
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup compiler was not found" }
          & $iscc.FullName $installerScript
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $installer = Get-Item "Transition-Lab-0.1.0-Windows-x64-Setup.exe"
          if ($installer.Length -lt 1048576) { throw "Installer output is unexpectedly small" }
          $installerHash = Get-FileHash $installer.FullName -Algorithm SHA256
          $installerHash | Format-List | Tee-Object -FilePath Transition-Lab-0.1.0-Windows-x64-Setup.sha256.txt | Out-Host
          $cleanInstall = Join-Path $env:RUNNER_TEMP "TransitionLabCleanInstall"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$cleanInstall" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer test failed with exit code $($install.ExitCode)" }
          $installedExe = Join-Path $cleanInstall "shotcut.exe"
          if (-not (Test-Path $installedExe)) { throw "Silent installer test did not install shotcut.exe" }
          $installedPlugin = Get-ChildItem -Path $cleanInstall -Recurse -Filter transitionlab_panels.dll | Select-Object -First 1
          if (-not $installedPlugin) { throw "Silent installer test did not install transitionlab_panels.dll" }
          Write-Host "Clean Windows install smoke test passed: $installedExe"
          $e2eDir = Join-Path $env:RUNNER_TEMP "TransitionLabExportE2E"
          New-Item -ItemType Directory -Force -Path $e2eDir | Out-Null
          Add-Type -AssemblyName System.Drawing
          $photoFiles = @()
          foreach ($entry in @(@("photo-red.png", [System.Drawing.Color]::Firebrick), @("photo-blue.png", [System.Drawing.Color]::RoyalBlue))) {
            $path = Join-Path $e2eDir $entry[0]
            $bitmap = New-Object System.Drawing.Bitmap 1920, 1080
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.Clear($entry[1])
            $graphics.Dispose()
            $bitmap.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $bitmap.Dispose()
            $photoFiles += $path
          }
          $uiExport = Join-Path $e2eDir "transition-lab-ui-export.mp4"
          $ffmpegPath = Join-Path (Split-Path $ffprobePath) "ffmpeg.exe"
          if (-not (Test-Path $ffmpegPath)) { throw "ffmpeg is unavailable for audio test input" }
          $audioInput = Join-Path $e2eDir "music-test.wav"
          & $ffmpegPath -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=12" -ac 2 -c:a pcm_s16le -y $audioInput
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $audioInput)) { throw "Audio test input was not produced" }
          $env:TRANSITION_LAB_E2E_AUDIO = $audioInput
          $env:TRANSITION_LAB_E2E_PHOTOS = $photoFiles -join ";"
          $env:TRANSITION_LAB_E2E_OUTPUT = $uiExport
          $env:APPDATA = Join-Path $e2eDir "AppData"
          $env:LOCALAPPDATA = Join-Path $e2eDir "LocalAppData"
          New-Item -ItemType Directory -Force -Path $env:APPDATA, $env:LOCALAPPDATA | Out-Null
          $env:SHOTCUT_WATCHDOG = "1"
          $stdoutLog = Join-Path $e2eDir "shotcut-stdout.log"
          $stderrLog = Join-Path $e2eDir "shotcut-stderr.log"
          Start-Process -FilePath $installedExe -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog | Out-Null
          $deadline = (Get-Date).AddMinutes(8)
          $lastSize = -1
          $stableChecks = 0
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            if (Test-Path $uiExport) {
              $size = (Get-Item $uiExport).Length
              if ($size -gt 1024 -and $size -eq $lastSize) {
                $stableChecks++
                if ($stableChecks -ge 3) { break }
              } else {
                $stableChecks = 0
              }
              $lastSize = $size
            }
          }
          Get-Process shotcut -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path $uiExport)) {
            if (Test-Path $stdoutLog) { Get-Content $stdoutLog | Out-Host }
            if (Test-Path $stderrLog) { Get-Content $stderrLog | Out-Host }
            Copy-Item $stdoutLog transition-lab-ui-stdout.log -ErrorAction SilentlyContinue
            Copy-Item $stderrLog transition-lab-ui-stderr.log -ErrorAction SilentlyContinue
            throw "Installed application Export MP4 flow produced no file"
          }
          if ((Get-Item $uiExport).Length -lt 1024) { throw "Installed application Export MP4 output is unexpectedly small" }
          $uiProbe = & $ffprobePath -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 $uiExport 2>&1
          if ($LASTEXITCODE -ne 0) { throw "ffprobe rejected the installed application export with exit code $LASTEXITCODE" }
          $uiProbe | Out-File transition-lab-ui-export-probe.txt
          $uiProbeText = $uiProbe -join "`n"
          if ($uiProbeText -notmatch '(?m)^codec_name=h264$') { throw "UI export is not H.264: $uiProbeText" }
          if ($uiProbeText -notmatch '(?m)^width=1920$') { throw "UI export is not 1920 pixels wide: $uiProbeText" }
          if ($uiProbeText -notmatch '(?m)^height=1080$') { throw "UI export is not 1080 pixels high: $uiProbeText" }
          if ($uiProbeText -notmatch '(?m)^r_frame_rate=(25|30)/1$') { throw "UI export is not 25 or 30 fps: $uiProbeText" }
          $audioProbe = & $ffprobePath -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate -of default=noprint_wrappers=1 $uiExport 2>&1
          if ($LASTEXITCODE -ne 0) { throw "ffprobe rejected the installed application audio stream" }
          $audioProbe | Out-File transition-lab-ui-audio-probe.txt
          if (($audioProbe -join "`n") -notmatch '(?m)^codec_name=aac$') {
            throw "Installed application export has no AAC music stream: $($audioProbe -join ', ')"
          }
          Write-Host "Installed application export includes AAC music"
          $durationText = & $ffprobePath -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 $uiExport
          if ($LASTEXITCODE -ne 0) { throw "Unable to measure exported MP4 duration" }
          $duration = [double]::Parse(($durationText | Select-Object -First 1), [System.Globalization.CultureInfo]::InvariantCulture)
          if ($duration -lt 5) { throw "Export is too short for audio fade validation: $duration seconds" }
          Write-Host "Installed export duration: $duration seconds (two photos, 12-second input music)"
          if ($duration -gt 10.2) { throw "Export duration exceeds the two-photo slideshow: $duration seconds" }
          function Measure-MeanVolume([double] $start) {
            $offset = $start.ToString("F3", [System.Globalization.CultureInfo]::InvariantCulture)
            $report = & $ffmpegPath -hide_banner -nostats -i $uiExport -ss $offset -t 0.5 -map 0:a:0 -af volumedetect -f null NUL 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Audio volume measurement failed at $offset seconds" }
            $match = [regex]::Match(($report -join "`n"), 'mean_volume:\s*(-?(?:inf|[0-9]+(?:\.[0-9]+)?))\s*dB', 'IgnoreCase')
            if (-not $match.Success) { throw "No audio volume measurement at $offset seconds" }
            if ($match.Groups[1].Value -eq '-inf') { return -100.0 }
            return [double]::Parse($match.Groups[1].Value, [System.Globalization.CultureInfo]::InvariantCulture)
          }
          $startVolume = Measure-MeanVolume 0
          $middleVolume = Measure-MeanVolume ([Math]::Max(2.5, $duration / 2 - 0.25))
          $endVolume = Measure-MeanVolume ($duration - 0.5)
          "start=$startVolume middle=$middleVolume end=$endVolume" | Tee-Object transition-lab-ui-audio-fades.txt | Out-Host
          if ($startVolume -gt $middleVolume - 5 -or $endVolume -gt $middleVolume - 5) {
            if (Test-Path $stderrLog) { Get-Content $stderrLog | Select-String 'TRANSITION_LAB_E2E' | Out-Host }
            throw "Audio Fade In/Out was not measurable in exported MP4"
          }
          Write-Host "Installed application audio Fade In/Out passed"
          Copy-Item $uiExport transition-lab-ui-export.mp4
          Get-FileHash $uiExport -Algorithm SHA256 | Format-List | Out-File transition-lab-ui-export.sha256.txt
          Write-Host "Installed application Export MP4 end-to-end test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: transition-lab-foundation-windows-x64
          path: |
            transition-lab-foundation-windows-x64.zip
            transition-lab-foundation-smoke.txt
            transition-lab-panels-smoke.txt
            transition-lab-mlt-transitions.txt
            transition-lab-panels-render.mp4
            transition-lab-panels-render-smoke.txt
            transition-lab-export-probe.txt
            transition-lab-ui-export.mp4
            transition-lab-ui-export-probe.txt
            transition-lab-ui-audio-probe.txt
            transition-lab-ui-audio-fades.txt
            transition-lab-ui-export.sha256.txt
            transition-lab-ui-stdout.log
            transition-lab-ui-stderr.log
            Transition-Lab-0.1.0-Windows-x64-Setup.exe
            Transition-Lab-0.1.0-Windows-x64-Setup.sha256.txt
          if-no-files-found: error
          retention-days: 30
          if: always()
